name: Package skills
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        run: |
          mkdir dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -r "../dist/${name}.zip" "$name"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip